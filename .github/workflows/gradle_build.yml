name: Fabric 1.21.1 build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew :common:test :fabric:build buildJar
      - uses: actions/upload-artifact@v4
        with:
          name: FallingTree
          path: build/libs/FallingTree-1.21.1-1.21.1.11.jar
          if-no-files-found: error
